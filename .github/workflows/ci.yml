name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-android:
    name: Unit tests + Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run shared unit tests
        run: ./gradlew :shared:jvmTest --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-jvm-test-report
          path: shared/build/reports/tests/jvmTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  ios-framework:
    name: iOS framework compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Link iOS simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
